  <style>
    :root { --ink:#f4ecd8; --gold:#fede79; --orange:#ff6a00; }
    * { box-sizing: border-box; }
    html, body { margin: 0; color: var(--ink); }
    body {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      background: #2a1810 url("assets/chia-wash.jpg") center / cover fixed no-repeat;
    }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: rgba(8,4,2,.42);
    }
    a { color: var(--gold); text-decoration: none; }
    a:hover { color: #fff; }
    img { display: block; width: 100%; }
    .page { position: relative; z-index: 1; width: min(1100px, calc(100% - 28px)); margin: 0 auto; padding: 18px 0 36px; }
    .banner {
      width: 100%;
      height: 180px;
      background: #111 url("assets/tanggang-banner.jpg") center / cover no-repeat;
      margin-bottom: 22px;
    }
    header { text-align: center; margin-bottom: 22px; }
    h1 {
      font-family: "Black Ops One", sans-serif;
      font-size: clamp(52px, 13vw, 100px);
      letter-spacing: .08em; margin: 0; line-height: .92;
      color: #fff6c4;
      -webkit-text-stroke: 1px rgba(255, 180, 40, .55);
      text-shadow:
        0 0 2px #fff,
        0 0 10px #fede79,
        0 0 22px #ff6a00,
        0 0 42px rgba(255,106,0,.7),
        0 3px 0 #3a1400;
    }
    .eth { color: var(--gold); margin-top: 8px; font-size: 15px; letter-spacing: .04em; }
    .sub { color: #ffe7c4; margin-top: 6px; font-size: 12px; }
    .line { margin: 12px auto 0; max-width: 50ch; font-size: 13px; color: #ffe7c4; text-shadow: 0 1px 6px #000; }
    .links { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .btn {
      padding: 8px 14px; border: 1px solid var(--gold);
      font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
      background: rgba(0,0,0,.4);
    }
    .btn.hot { background: var(--orange); color: #111; border-color: var(--orange); }
    .top {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 8px;
    }
    .top img, .more img { aspect-ratio: 1; object-fit: cover; }
    .more {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
    }
    footer { margin-top: 22px; text-align: center; font-size: 11px; color: #c9b89a; }
    .site-version { position: fixed; right: 8px; bottom: 8px; font-size: 10px; color: rgba(254,222,121,.35); }
    @media (max-width: 800px) {
      .top { grid-template-columns: repeat(3, 1fr); }
      .more { grid-template-columns: repeat(4, 1fr); }
      .banner { height: 110px; }
    }
  </style>
